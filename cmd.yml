gcloud run services update cl \
    --region asia-south1 \
    --image asia-south1-docker.pkg.dev/schoolmate-498917/colune/cl:v7 \
    --port 8080 \
    --add-cloudsql-instances schoolmate-498917:asia-south1:schoolmate \
    --command /bin/sh \
    --args="-c,python manage.py migrate --noinput && python manage.py collectstatic --noinput && python manage.py ensure_superuser && gunicorn server.wsgi:application --bind 0.0.0.0:\$PORT"


gcloud auth login
gcloud config set project <collune>
gcloud auth configure-docker \                                                                       
    asia-south1-docker.pkg.dev

GOOGLE_OAUTH_ACCESS_TOKEN=$(gcloud auth print-access-token) terraform apply -auto-approve
sudo docker build -t asia-south1-docker.pkg.dev/collune/collune/collune-backend:latest . 
docker push asia-south1-docker.pkg.dev/collune/collune/collune-backend:latest
sudo docker build -t asia-south1-docker.pkg.dev/collune/collune/collune-frontend:latest ./client 
docker push asia-south1-docker.pkg.dev/collune/collune/collune-frontend:latest
sudo docker build -t asia-south1-docker.pkg.dev/collune/collune/collune-admin:latest ./Admin 
docker push asia-south1-docker.pkg.dev/collune/collune/collune-admin:latest

gcloud builds submit --tag asia-south1-docker.pkg.dev/collune/collune-server/collune-backend:latest .


gcloud run services add-iam-policy-binding collune-backend \
    --region=asia-south1 \
    --member="allUsers" \
    --role="roles/run.invoker"

gcloud run services add-iam-policy-binding collune-frontend \
    --region=asia-south1 \
    --member="allUsers" \
    --role="roles/run.invoker"

gcloud run services add-iam-policy-binding collune-admin \
    --region=asia-south1 \
    --member="allUsers" \
    --role="roles/run.invoker"
