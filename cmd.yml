gcloud run services update cl \
    --region asia-south1 \
    --image asia-south1-docker.pkg.dev/schoolmate-498917/colune/cl:v7 \
    --port 8080 \
    --add-cloudsql-instances schoolmate-498917:asia-south1:schoolmate \
    --command /bin/sh \
    --args="-c,python manage.py migrate --noinput && gunicorn server.wsgi:application --bind 0.0.0.0:\$PORT"


gcloud auth login
gcloud config set project <collune>
gcloud auth configure-docker \                                                                       
    asia-south1-docker.pkg.dev
GOOGLE_OAUTH_ACCESS_TOKEN=$(gcloud auth print-access-token) terraform apply -auto-approve
sudo docker build -t asia-south1-docker.pkg.dev/collune/collune/collune-backend:latest . 
docker push asia-south1-docker.pkg.dev/collune/collune/collune-backend:latest
sudo docker build -t asia-south1-docker.pkg.dev/collune/collune/collune-frontend:latest . 
docker push asia-south1-docker.pkg.dev/collune/collune/collune-frontend:latest

gcloud builds submit --tag asia-south1-docker.pkg.dev/collune/collune-server/collune-backend:latest .